# Screenshots of a released Ladrok Store on an Android TV emulator, against the live Catalog:
# the main screen, Search, and the FOSS screen. They go on the rolling "screenshots" release.
name: Screenshots

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Store release to show, e.g. v0.3.0'
        required: true
  pull_request:
    paths: ['.github/workflows/screenshots.yml', 'tools/screenshots.py']

permissions:
  contents: write

env:
  VERSION: ${{ inputs.version || 'v0.3.0' }}

jobs:
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android TV emulator
        run: |
          sdk="$ANDROID_HOME/cmdline-tools/latest/bin"
          yes | "$sdk/sdkmanager" --licenses > /dev/null
          "$sdk/sdkmanager" --install emulator platform-tools "system-images;android-34;android-tv;x86" > /dev/null
          # Where both avdmanager and the emulator look, whatever HOME the runner sets.
          export ANDROID_AVD_HOME="$RUNNER_TEMP/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          echo no | "$sdk/avdmanager" create avd -n tv -k "system-images;android-34;android-tv;x86" -d tv_1080p
          ls "$ANDROID_AVD_HOME"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Boot
        run: |
          emulator -avd tv -no-window -no-audio -no-snapshot -no-boot-anim -accel on -gpu swiftshader_indirect \
            > "$RUNNER_TEMP/emulator.log" 2>&1 &
          for i in $(seq 1 120); do
            [ "$(timeout 10 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ] && break
            if ! pgrep -f qemu-system > /dev/null; then echo "The emulator exited"; break; fi
            sleep 5
          done
          if [ "$(timeout 10 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" != 1 ]; then
            tail -80 "$RUNNER_TEMP/emulator.log"; exit 1
          fi
          sleep 20

      - name: Screenshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$VERSION" -p LadrokStore.apk -D "$RUNNER_TEMP"
          python3 tools/screenshots.py "$RUNNER_TEMP/LadrokStore.apk" out

      - name: Publish
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(out/*.png)
          [ ${#files[@]} -gt 0 ] || { tail -50 "$RUNNER_TEMP/emulator.log"; exit 1; }
          gh release view screenshots > /dev/null 2>&1 || gh release create screenshots --latest=false --prerelease \
            --title "Screenshots" --notes "Ladrok Store on an Android TV emulator. Updated by the Screenshots workflow."
          gh release upload screenshots "${files[@]}" --clobber
