# On a version tag (v1.2.0): tests, then a release-signed LadrokStore.apk attached to a GitHub
# Release together with its SHA-256. ladrok-tv's apply-patches.sh downloads a pinned version and checks it.
# Repo secrets (the same key as Ladrok Launcher): LADROK_KEYSTORE_B64 (base64 of the .jks) and
# LADROK_KEYSTORE_PASSWORD.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.LADROK_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "The LADROK_KEYSTORE_B64 secret is missing" >&2; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "LADROK_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build
        env:
          LADROK_KEYSTORE_PASSWORD: ${{ secrets.LADROK_KEYSTORE_PASSWORD }}
          LADROK_VERSION: ${{ github.ref_name }}
        run: ./gradlew assembleRelease --console=plain

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk LadrokStore.apk
          sha256sum LadrokStore.apk > LadrokStore.apk.sha256
          gh release create "$GITHUB_REF_NAME" LadrokStore.apk LadrokStore.apk.sha256 \
            --title "Ladrok Store $GITHUB_REF_NAME" --notes "Built from ${GITHUB_SHA::7}." --verify-tag

      - name: Clean up
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
