# On a version tag (v1.2.0), or run by hand with a version (Actions > Release > Run workflow,
# which tags the commit it runs on): tests, then a release-signed LadrokStore.apk attached to a GitHub
# Release together with its SHA-256. ladrok-tv's fetch-prebuilts.sh builds the newest release into the
# system image, accepting it only if it is signed with the pinned certificate.
# Repo secrets (the same key as Ladrok Launcher): LADROK_KEYSTORE_B64 (base64 of the .jks) and
# LADROK_KEYSTORE_PASSWORD.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. v0.1.0'
        required: true

env:
  VERSION: ${{ inputs.version || github.ref_name }}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.LADROK_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "The LADROK_KEYSTORE_B64 secret is missing" >&2; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "LADROK_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build
        env:
          LADROK_KEYSTORE_PASSWORD: ${{ secrets.LADROK_KEYSTORE_PASSWORD }}
          LADROK_VERSION: ${{ env.VERSION }}
        run: ./gradlew assembleRelease --console=plain

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk LadrokStore.apk
          sha256sum LadrokStore.apk > LadrokStore.apk.sha256
          case "$VERSION" in v[0-9]*) ;; *) echo "Version must look like v1.2.0, not $VERSION" >&2; exit 1;; esac
          # From a tag push the tag exists; from a manual run gh creates it on this commit.
          gh release create "$VERSION" LadrokStore.apk LadrokStore.apk.sha256 \
            --title "Ladrok Store $VERSION" --notes "Built from ${GITHUB_SHA::7}." --target "$GITHUB_SHA"

      - name: Clean up
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
