# The Catalog: the Apps Ladrok Store offers. Adding an App is a pull request to this file.
#
# The resolver (.github/workflows/catalog.yml) runs on every change here and once a day. For each
# App it finds the newest APK, checks it (package name, Android TV launcher entry, ABI, signing
# certificate, no downgrade) and publishes the signed catalog.json the Store downloads.
#
# Fields:
#   id        package name; the APK must match it
#   label     name shown in the Store (default: the APK's own label)
#   summary   one or two sentences for the App's page
#   category  the row it goes in
#   home      true for the home screen itself: it needs no Android TV launcher entry
#   icon      a PNG in catalog/icons/ to show instead of the APK's launcher icon (for a vector
#             icon the resolver can't draw)
#   signer    SHA-256 of the signing certificate (colons optional). Leave it out at first: the
#             first run prints it in the job summary and every later version must match it anyway.
#   source    where the APK comes from:
#     github  (default) repo: owner/name; asset: regex on the release asset name;
#             prerelease: true to take pre-releases too
#     fdroid  F-Droid's main repo; signed by F-Droid, so it won't update a copy from elsewhere
#     page    page: a download page; link: regex for APK links on it (tried in page order)

# What the TV runs. The Raspberry Pi 5 build is 64-bit ARM.
abis: [arm64-v8a]

apps:
  - id: com.nuvio.tv
    label: Nuvio
    summary: Movies and series from your Stremio add-ons, made for the TV.
    category: Watch
    source: github
    repo: NuvioMedia/NuvioTV
    asset: 'arm64-v8a.*\.apk$'
    signer: 1cba06fbdf978d0e3f9ad58de6ba3d69e24a948384adde3aed95451e830e5210

  - id: com.stremio.one
    label: Stremio
    summary: Watch movies, series and live TV through add-ons.
    category: Watch
    source: page
    page: https://www.stremio.com/downloads
    # The vX-android/ builds there are the phone app (no TV launcher entry): skip them.
    link: 'https://dl\.strem\.io/(?![^"''\s<>]*-android/)[^"''\s<>]+\.apk'
    signer: 7e6a979c968f771e3fbcf2c2e8718ce61e708d87caf91fc13e2d4c19a8022c6b

  - id: com.tailscale.ipn
    label: Tailscale
    summary: Puts the TV on your Tailscale network, to reach your home server from anywhere.
    category: Network
    source: fdroid
    signer: 3705f184cb67d683e76ecc203cc9cc357e6448c50e59002419085b4c286df0e8

  - id: org.jellyfin.androidtv
    label: Jellyfin
    summary: Watch your own films, series and music from a Jellyfin server.
    category: Watch
    source: github
    repo: jellyfin/jellyfin-androidtv
    asset: '^(?!.*debug).*\.apk$'
    signer: d881796ed2a67ff6ef9f676828723c6b1fa18e09388962cba4abc4a594a69131

  # The Store itself: it updates itself like any other App (same signing key, so it stays privileged).
  - id: tv.ladrok.store
    label: Ladrok Store
    summary: This store. Keeps itself up to date like the other Apps.
    category: System
    source: github
    repo: Kordal/ladrok-store
    asset: '^LadrokStore\.apk$'
    icon: icons/tv.ladrok.store.png
    signer: 00d9faeb7a77c0d3edcc6f9ba807b7061faa49fb6c60daf808dc79c9ee6ac43e

  # The home screen. Built into the system image; the Store keeps it up to date between system
  # updates (it can't be uninstalled from the Store).
  - id: tv.ladrok.launcher
    label: Ladrok Launcher
    summary: The home screen. Kept up to date like the other Apps.
    category: System
    source: github
    repo: Kordal/ladrok-start
    asset: '^LadrokLauncher\.apk$'
    icon: icons/tv.ladrok.launcher.png
    home: true
    signer: 00d9faeb7a77c0d3edcc6f9ba807b7061faa49fb6c60daf808dc79c9ee6ac43e
