[versions]
agp = "9.4.1"
kotlin = "2.4.20"
composeBom = "2026.09.00"
tvMaterial = "1.1.0"
activity = "1.13.0"
core = "1.19.1"
coil = "3.6.3"
junit = "4.13.2"
json = "20260814" # org.json for unit tests: android.jar only has stubs

[libraries]
androidx-core = { module = "androidx.core:core-ktx", version.ref = "core" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }
tv-material = { module = "androidx.tv:tv-material", version.ref = "tvMaterial" }
junit = { module = "junit:junit", version.ref = "junit" }
json = { module = "org.json:json", version.ref = "json" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
